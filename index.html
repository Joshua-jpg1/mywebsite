<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Online Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif; color: #1f2937;
      background: linear-gradient(135deg, #e0f2fe, #f5f3ff);
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .card {
      width: min(100%, 560px); background: white; border-radius: 18px;
      padding: 30px; box-shadow: 0 12px 35px #1e293b1c;
    }
    h1 { margin: 0 0 8px; color: #123b63; }
    .sub { color: #64748b; margin-top: 0; }
    label { display: block; font-weight: 700; margin: 22px 0 8px; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1;
      border-radius: 9px; font-size: 16px;
    }
    button {
      border: 0; border-radius: 9px; padding: 12px 16px; cursor: pointer;
      font-size: 15px; font-weight: 700; background: #1769aa; color: white;
      margin: 10px 8px 0 0;
    }
    button.secondary { background: #e2e8f0; color: #1e293b; }
    .result {
      background: #eff6ff; border-radius: 10px; padding: 14px;
      margin-top: 18px; min-height: 48px;
    }
    .clock { font-size: 25px; font-weight: 700; color: #1769aa; }
    footer { color: #94a3b8; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>My First Online Test 🚀</h1>
    <p class="sub">A simple sample website to practice publishing an index.html file.</p>

    <label for="visitorName">Enter your name</label>
    <input id="visitorName" type="text" placeholder="Example: Juan Dela Cruz">
    <button onclick="greetUser()">Say Hello</button>
    <div class="result" id="greeting">Your greeting will appear here.</div>

    <label>Live Philippine Time</label>
    <div class="clock" id="clock">Loading...</div>

    <label>Random Number Generator</label>
    <div class="result" id="randomResult">Click the button to generate a number from 1 to 100.</div>
    <button onclick="generateNumber()">Generate Number</button>
    <button class="secondary" onclick="resetDemo()">Reset Demo</button>

    <footer>Demo website • HTML, CSS and JavaScript in one file</footer>
  </main>

  <script>
    function greetUser() {
      const name = document.getElementById('visitorName').value.trim();
      document.getElementById('greeting').textContent =
        name ? `Hello, ${name}! Your website is working!` : 'Please enter your name first.';
    }

    function updateClock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('en-PH', {
          timeZone: 'Asia/Manila', hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    }

    function generateNumber() {
      const number = Math.floor(Math.random() * 100) + 1;
      document.getElementById('randomResult').textContent = `Your random number is: ${number}`;
    }

    function resetDemo() {
      document.getElementById('visitorName').value = '';
      document.getElementById('greeting').textContent = 'Your greeting will appear here.';
      document.getElementById('randomResult').textContent =
        'Click the button to generate a number from 1 to 100.';
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
